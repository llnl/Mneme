[build-system]
requires = [
  "scikit-build-core>=0.9",
]
build-backend = "scikit_build_core.build"

[project]
name = "mneme"
version = "0.1.0"
description = "Python bindings for the Mneme GPU replay and autotuning tool"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Konstantinos Parasyris", email = "koparasy@gmail.com"},
]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "PyYAML>=6.0",
  "optuna>=4.4",
  "scipy",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-mock>=3.0",
  "pytest-cov",
]

[project.scripts]
mneme = "mneme.cli:main"

[tool.scikit-build]
cmake.build-type = "RelWithDebInfo"
# pure python sources
wheel.packages = ["python/mneme"]

[tool.scikit-build.cmake.define]
MNEME_ENABLE_PYTHON = "ON"
MNEME_ENABLE_TESTS  = "OFF"
MNEME_ENABLE_LOGGER = "ON"
MNEME_PYTHON_WHEEL  = "ON"
# LLVM_INSTALL_DIR, MNEME_GPU_BACKEND (cuda or hip):
# read from the environment or CMAKE_ARGS at build time.
