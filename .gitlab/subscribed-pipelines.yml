# The template job to test whether a machine is up.
# Expects CI_MACHINE defined to machine name.
# It fails so that "Retry failed jobs" re-runs the check and then creates the
# skipped sub-pipelines with the machine's current state.
.machine-check:
  stage: prerequisites
  interruptible: true
  tags: [shell, oslic]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [[ $(jq '.[env.CI_MACHINE].total_nodes_up' /usr/global/tools/lorenz/data/loginnodeStatus) == 0 ]]
      then
        echo -e "\e[31mNo node available on ${CI_MACHINE}\e[0m"
        exit 1
      fi

.pipeline-trigger-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to develop.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &pipeline_trigger_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - ".coveragerc"
          - "CMakeLists.txt"
          - "cmake/**/*"
          - "include/**/*"
          - "pyproject.toml"
          - "python/**/*"
          - "pytest.ini"
          - "scripts/gitlab/**/*"
          - "setup.cfg"
          - "setup.py"
          - "src/**/*"
          - "tests/**/*"
          - "packaging/spack/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: &compare_to_ref "refs/heads/develop"
        paths: *pipeline_trigger_paths

.spack-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &spack_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - "CMakeLists.txt"
          - "cmake/**/*"
          - "packaging/spack/**/*"
          - "tests/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: *compare_to_ref
        paths: *spack_paths

.core-build-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to develop.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &core_build_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - "CMakeLists.txt"
          - "cmake/**/*"
          - "include/**/*"
          - "scripts/gitlab/**/*"
          - "src/**/*"
          - "tests/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: *compare_to_ref
        paths: *core_build_paths

.python-rules:
  rules:
    # For default-branch push pipelines, rules:changes compares against the
    # previous commit on the branch. Non-default branches compare to develop.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: &python_paths
          - ".gitlab-ci.yml"
          - ".gitlab/**/*"
          - ".coveragerc"
          - "CMakeLists.txt"
          - "cmake/**/*"
          - "include/**/*"
          - "pyproject.toml"
          - "python/**/*"
          - "pytest.ini"
          - "scripts/gitlab/**/*"
          - "setup.cfg"
          - "setup.py"
          - "src/**/*"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: *compare_to_ref
        paths: *python_paths

#################################
#    System Up Check            #
#################################

# MATRIX
matrix-up-check:
  variables:
    CI_MACHINE: "matrix"
  extends: [.machine-check, .pipeline-trigger-rules]

tioga-up-check:
  variables:
    CI_MACHINE: "tioga"
  extends: [.machine-check, .pipeline-trigger-rules]

tuolumne-up-check:
  variables:
    CI_MACHINE: "tuolumne"
  extends: [.machine-check, .pipeline-trigger-rules]

#################################
#       C/C++ Tests             #
#################################
matrix-build-and-test:
  variables:
    CI_MACHINE: "matrix"
  needs: [matrix-up-check]
  extends: [.build-and-test, .core-build-rules]

tioga-build-and-test:
  variables:
    CI_MACHINE: "tioga"
  needs: [tioga-up-check]
  extends: [.build-and-test, .core-build-rules]

tuolumne-build-and-test:
  variables:
    CI_MACHINE: "tuolumne"
  needs: [tuolumne-up-check]
  extends: [.build-and-test, .core-build-rules]


#################################
#       Python Tests            #
#################################
tioga-test-python-cov:
  variables:
    CI_MACHINE: "tioga"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tioga-up-check]
  extends: [.test-python-cov, .python-rules]

tuolumne-test-python-cov:
  variables:
    CI_MACHINE: "tuolumne"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [tuolumne-up-check]
  extends: [.test-python-cov, .python-rules]

matrix-test-python-cov:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "scripts/gitlab/ci-python-test.sh"
      expand: false
  needs: [matrix-up-check]
  extends: [.test-python-cov, .python-rules]

#################################
#       Spack Tests             #
#################################
tioga-test-spack:
  variables:
    CI_MACHINE: "tioga"
    JOB_CMD:
      value: "tests/spack/hip/ci-test-spack.sh"
      expand: false
  needs:
    - job: tioga-up-check
    - job: tioga-build-and-test
      optional: true
  extends: [.test-spack, .spack-rules]

tuolumne-test-spack:
  variables:
    CI_MACHINE: "tuolumne"
    JOB_CMD:
      value: "tests/spack/hip/ci-test-spack.sh"
      expand: false
  needs:
    - job: tuolumne-up-check
    - job: tuolumne-build-and-test
      optional: true
  extends: [.test-spack, .spack-rules]

matrix-test-spack:
  variables:
    CI_MACHINE: "matrix"
    JOB_CMD:
      value: "tests/spack/cuda/ci-test-spack.sh"
      expand: false
  needs:
    - job: matrix-up-check
    - job: matrix-build-and-test
      optional: true
  extends: [.test-spack, .spack-rules]
