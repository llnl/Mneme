.base-job:
  extends: .job_on_matrix
  interruptible: true
  before_script:
    - !reference [.select-bank, before_script]
    - echo "=== Start CI Spack Tests ==="
  after_script:
    - !reference [.clean-slurm-allocation, after_script]
    - !reference [.remove-builds-dir, after_script]
    - echo "=== End CI Spack Tests ==="

.variants:
  parallel:
    matrix:
      - MNEME_CI_CUDA_VERSION: ["12.9"]  # Clang/LLVM constraints in spack require newer cuda versions
        MNEME_CI_LLVM_VERSION: ["19.1.3"]

test-spack-matrix:
  extends: [.base-job, .variants]
  variables:
    MNEME_CI_CUDA_ARCH: "90"
